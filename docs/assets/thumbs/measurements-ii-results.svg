<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Insulation resistance time ratios from Electrical Measurements II</title>
  <desc id="desc">Cable 1.02, dry transformer 1.44, motor 1.01. Ratios use different measurement intervals and are not directly comparable as equipment ratings.</desc>
  <rect width="960" height="540" fill="#f2f4f2"/>
  <rect x="52" y="45" width="856" height="450" rx="8" fill="#fff" stroke="#d9e0dd"/>
  <text x="95" y="105" fill="#183b39" font-family="Arial, sans-serif" font-size="25" font-weight="700">ELECTRICAL MEASUREMENTS II</text>
  <text x="95" y="139" fill="#536560" font-family="Arial, sans-serif" font-size="18">Insulation resistance · recorded time ratios</text>
  <line x1="95" y1="168" x2="865" y2="168" stroke="#d9e0dd"/>
  <g font-family="Arial, sans-serif" font-size="19" fill="#233a39">
    <text x="95" y="223">Cable · 60 s / 30 s</text>
    <text x="95" y="307">Dry transformer · 10 min / 1 min</text>
    <text x="95" y="391">Motor · 10 min / 1 min</text>
  </g>
  <g fill="#e5edeb">
    <rect x="420" y="193" width="360" height="32" rx="3"/>
    <rect x="420" y="277" width="360" height="32" rx="3"/>
    <rect x="420" y="361" width="360" height="32" rx="3"/>
  </g>
  <g fill="#276a63">
    <rect x="420" y="193" width="255" height="32" rx="3"/>
    <rect x="420" y="277" width="360" height="32" rx="3"/>
    <rect x="420" y="361" width="253" height="32" rx="3"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#183b39">
    <text x="803" y="218">1.02</text>
    <text x="803" y="302">1.44</text>
    <text x="803" y="386">1.01</text>
  </g>
  <text x="95" y="459" fill="#64736f" font-family="Arial, sans-serif" font-size="15">Supervised university labs · September 2026 · ratios rounded</text>
</svg>
