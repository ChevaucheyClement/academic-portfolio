{%- comment -%} Global head override {%- endcomment -%}

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}

<link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/modern.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/landing.css' | relative_url }}?v={{ site.time | date: '%s' }}">

<script defer src="{{ '/assets/js/theme.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>

{% if page.url == '/' or page.url == '/es/' %}
<link rel="alternate" hreflang="en" href="{{ '/' | absolute_url }}">
<link rel="alternate" hreflang="es" href="{{ '/es/' | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
{% endif %}
{% if page.url == '/measurements-ii/' or page.url == '/es/measurements-ii/' %}
<link rel="alternate" hreflang="en" href="{{ '/measurements-ii/' | absolute_url }}">
<link rel="alternate" hreflang="es" href="{{ '/es/measurements-ii/' | absolute_url }}">
{% endif %}
