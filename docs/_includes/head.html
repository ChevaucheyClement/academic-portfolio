{%- comment -%} Global head override {%- endcomment -%}

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="{{ '/assets/js/language.js' | relative_url }}?v={{ site.time | date: '%s' }}"
        data-en="{{ site.data.routes.home.en | relative_url }}"
        data-es="{{ site.data.routes.home.es | relative_url }}"
        data-fr="{{ site.data.routes.home.fr | relative_url }}"></script>

{% seo %}

<link rel="icon" type="image/svg+xml" href="{{ '/assets/social/favicon.svg' | relative_url }}">

<link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/modern.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/css/landing.css' | relative_url }}?v={{ site.time | date: '%s' }}">

<script defer src="{{ '/assets/js/theme.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>

{% assign translated_routes = site.data.routes[page.translation_key] %}
{% if translated_routes %}
  {% for option in site.data.languages %}
<link rel="alternate" hreflang="{{ option.code }}" href="{{ translated_routes[option.code] | absolute_url }}">
  {% endfor %}
  {% if page.translation_key == 'home' %}
<link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
  {% endif %}
{% endif %}
